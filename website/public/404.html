<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Page Not Found | Student Mental Health Analytics</title>
    <script>
      // Single Page Apps for GitHub Pages redirection script
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <h2>Redirecting to Student Mental Health Analytics portfolio...</h2>
    <p>If you are not redirected automatically, please visit <a href="/Skill-wallet-project/">here</a>.</p>
  </body>
</html>
